version: "2"

linters:
  settings:
    errcheck:
      # Writes to the CLI's own stdout/stderr. There is nothing to do with the
      # error — reporting a failed write to the stream that just failed is
      # circular, and the process exit code already carries the outcome.
      #
      # This is the ONLY errcheck exclusion. Everything else stays on
      # deliberately: an unchecked Close on a file the tool wrote is a real
      # defect class, and errcheck is what caught one in internal/workspace,
      # where a deferred Close could have returned the path to a truncated file
      # while reporting how many records it held.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
